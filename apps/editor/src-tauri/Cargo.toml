[package]
name = "jueony-editor"
version = "0.0.1"
edition = "2021"
publish = false
license-file = "../LICENSE.txt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[workspace]
